# 本地开发 profile: 无需 Docker/PostgreSQL/Kafka 即可启动。
# 启动: mvn spring-boot:run -Dspring-boot.run.profiles=local
# 生产使用默认 profile(PostgreSQL + Kafka, 见 docker-compose.yml)。
spring:
  datasource:
    url: jdbc:h2:mem:cabinet;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    listener:
      auto-startup: false
    producer:
      properties:
        max.block.ms: 1000
        request.timeout.ms: 1000
        delivery.timeout.ms: 1000

app:
  kafka:
    auto-create-topics: false
    publish-enabled: false
  expiry:
    near-expiry-days: 2
